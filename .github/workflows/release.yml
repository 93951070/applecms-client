name: Flutter Mobile Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android
            os: ubuntu-latest
            build_cmd: flutter build apk --release --target-platform android-arm,android-arm64
            artifact_path: build/app/outputs/flutter-apk/app-release.apk
            artifact_ext: apk

          - target: iOS
            os: macos-latest
            build_cmd: flutter build ios --release --no-codesign
            artifact_path: build/ios/iphoneos/Runner.app
            artifact_ext: ipa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java (for Android)
        if: matrix.target == 'Android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Application
        run: ${{ matrix.build_cmd }}

      - name: Set artifact name
        id: artifact
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "Android" ]; then
            echo "name=applecms-client-android" >> "$GITHUB_OUTPUT"
          else
            echo "name=applecms-client-ios" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ matrix.artifact_path }}

      - name: Package unsigned IPA (iOS)
        if: matrix.target == 'iOS'
        run: |
          APP_DIR="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "::error::未找到 Runner.app，构建可能失败"
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          zip -qr applecms-client-unsigned.ipa Payload

      # 发布为公开 Release 附件，免登录即可直接下载（TV 盒子/安卓设备安装用）
      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # tag 触发时用 tag 名，手动触发时落到 release-latest，便于用固定链接取包。
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="release-latest"
          fi
          # 矩阵两个 job 并行，create 冲突时忽略即可，upload 用 --clobber 覆盖
          gh release create "$TAG" --title "$TAG" \
            --notes "客户端构建 ${GITHUB_SHA}" 2>/dev/null || true
          if [ "${{ matrix.target }}" = "Android" ]; then
            ASSET="applecms-client-android.apk"
            cp "${{ matrix.artifact_path }}" "$ASSET"
          else
            ASSET="applecms-client-unsigned.ipa"
          fi
          gh release upload "$TAG" "$ASSET" --clobber
          echo "已发布: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
